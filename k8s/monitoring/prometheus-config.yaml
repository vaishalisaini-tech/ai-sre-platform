apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # Tell Prometheus where Alertmanager lives
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    # Load our alert rules (defined below in this same file)
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Scrape kube-state-metrics for pod/deployment state
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

      # Scrape the nodes' resource metrics via kubelet (cAdvisor)
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: ai-sre-alerts
        rules:
          # Fire when a pod restarts more than 3 times in 5 minutes
          - alert: PodRestartingTooOften
            expr: increase(kube_pod_container_status_restarts_total[5m]) > 3
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is restarting repeatedly"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} restarted more than 3 times in 5 minutes (likely CrashLoopBackOff)."

          # Fire when a container is using >80% of its memory limit
          - alert: HighMemoryUsage
            expr: |
              (container_memory_working_set_bytes{container!=""}
               / on(pod,container) kube_pod_container_resource_limits{resource="memory"}) > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.pod }}"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} is using over 80% of its memory limit."

